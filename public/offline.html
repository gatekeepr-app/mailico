<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#286653" />
    <title>You’re offline · Mailico</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f5f5f0; color: #1e2522; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); text-align: center; }
      .mark { width: 44px; height: 44px; margin: 0 auto 28px; display: grid; place-items: center; border-radius: 13px; color: white; background: #286653; font-size: 28px; font-weight: 600; }
      h1 { margin: 0; font-size: clamp(32px, 8vw, 48px); letter-spacing: -.06em; font-weight: 500; }
      p { margin: 16px 0 24px; color: #68716b; font-size: 15px; line-height: 1.65; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 7px; color: white; background: #286653; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">m</div>
      <h1>You’re offline.</h1>
      <p>Mailico needs a connection to securely load your inbox. Reconnect to the internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
